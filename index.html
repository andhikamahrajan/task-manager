<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugasku</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <span class="logo">Tugasku</span>
    <span class="tanggal">Senin, 23 November</span>
  </header>

  <main class="container">
    <h1>Tugas kamu</h1>
    <p class="subjudul">Catat, centang, selesai. Semua to-do list-mu di satu tempat.</p>

    <section class="kartu">
      <form class="form-tambah">
        <label for="judul" class="sr-only">Nama tugas</label>
        <input id="judul" type="text" placeholder="Tambah tugas baru">

        <label for="tenggat" class="sr-only">Tenggat (opsional)</label>
        <input id="tenggat" type="date">

        <button type="submit" class="tombol-tambah">Tambah</button>
      </form>

      <div class="filter">
        <button type="button" class="terpilih" data-filter="semua">Semua</button>
        <button type="button" data-filter="aktif">Aktif</button>
        <button type="button" data-filter="selesai">Selesai</button>
      </div>

      <ul class="daftar" id="daftar"></ul>
      <div class="kosong" id="kosong" hidden>
  <h2>Belum ada tugas</h2>
  <p>Tambahkan tugas pertamamu lewat kolom di atas.</p>
</div>

      <div class="footer-kartu">
        <span id="sisa">3 tugas tersisa</span>
        <button type="button" class="hapus-selesai">Hapus yang selesai</button>
      </div>
    </section>
  </main>
</body>
</html>
